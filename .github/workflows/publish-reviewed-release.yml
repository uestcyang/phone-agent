name: Publish reviewed core release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-reviewed-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-core-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'uestcyang/phone-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact source and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,urllib.error,urllib.parse
          REPO='uestcyang/phone-agent'
          SOURCE='f542b1b0b15ea458e280f97f4be327eadcedddda'
          ASSETS='0ec7feffb445a51c2e7cc4db40862b535bee272b'
          NAME='PhoneAgent-core-source-660045d3.zip'
          SHA='902a0d6cd8098aaca85332fcd484252421bcd596dab49e8a859563a91630fe90'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          TOKEN=os.environ['GH_TOKEN']
          BASE='https://api.github.com/repos/'+REPO

          def public(url):
           req=urllib.request.Request(url,headers={'User-Agent':'phone-agent-release'})
           with urllib.request.urlopen(req,timeout=60) as r:return r.read()

          def api(path,method='GET',data=None,binary=False):
           url=path if path.startswith('https://uploads.github.com/repos/'+REPO+'/releases/') else BASE+path
           assert url.startswith(BASE+'/') or url.startswith('https://uploads.github.com/repos/'+REPO+'/releases/')
           headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'phone-agent-release'}
           if data is not None:
            headers['Content-Type']='application/octet-stream' if binary else 'application/json'
            if not binary:data=json.dumps(data).encode()
           req=urllib.request.Request(url,headers=headers,data=data,method=method)
           with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)

          ref=api('/git/ref/tags/v0.1.0')['object']
          if ref['type']=='tag':ref=api('/git/tags/'+ref['sha'])['object']
          assert ref['type']=='commit' and ref['sha']==SOURCE,'Release tag changed'
          archive=public('https://raw.githubusercontent.com/'+REPO+'/'+ASSETS+'/'+NAME)
          assert hashlib.sha256(archive).hexdigest()==SHA,'Reviewed archive mismatch'
          checksums=(SHA+'  '+NAME+'\n').encode()
          notes=public('https://raw.githubusercontent.com/'+REPO+'/'+SOURCE+'/docs/RELEASE_NOTES_v0.1.0.md').decode()
          notes=notes.replace('(VALIDATION.md)','(https://github.com/'+REPO+'/blob/v0.1.0/docs/VALIDATION.md)').replace('(SETUP.md)','(https://github.com/'+REPO+'/blob/v0.1.0/docs/SETUP.md)')
          try:release=api('/releases/tags/v0.1.0')
          except urllib.error.HTTPError as e:
           if e.code!=404:raise
           release=api('/releases','POST',{'tag_name':'v0.1.0','target_commitish':SOURCE,'name':'Phone Agent v0.1.0 - Core Edition','body':notes,'draft':True,'prerelease':False})
          assert release['tag_name']=='v0.1.0'
          assert release['target_commitish'] in (SOURCE,'main')
          existing={a['name']:a for a in release['assets']}
          upload=release['upload_url'].split('{',1)[0]
          for name,data in [(NAME,archive),('PhoneAgent-v0.1.0-SHA256SUMS.txt',checksums)]:
           expected='sha256:'+hashlib.sha256(data).hexdigest()
           if name in existing:
            item=existing[name]
            if item.get('digest'):assert item['digest']==expected,'Existing asset content differs'
            else:
             assert not release['draft'],'Cannot verify existing draft asset without digest'
             assert hashlib.sha256(public(item['browser_download_url'])).hexdigest()==expected[7:]
           else:
            item=api(upload+'?'+urllib.parse.urlencode({'name':name}),'POST',data,True)
            assert item['size']==len(data)
            if item.get('digest'):assert item['digest']==expected
            print('Uploaded reviewed asset:',name)
          release=api('/releases/'+str(release['id']),'PATCH',{'name':'Phone Agent v0.1.0 - Core Edition','body':notes,'draft':False,'prerelease':False,'make_latest':'true'})
          assert not release['draft']
          print('Published:',release['html_url'])
          print('Reviewed archive SHA-256:',SHA)

          PY
